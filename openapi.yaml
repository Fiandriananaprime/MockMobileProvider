openapi: 3.0.3
info:
  title: mock-mobile-money-service
  version: 1.0.0
  description: |
    Faux fournisseur **MVola** et **Orange Money** pour le Payment Service NovaMarket. Les comptes et le ledger sont
    persistés dans PostgreSQL; l'état technique des tokens provider et des transactions provider reste en mémoire.

    L'API utilisateur et l'Admin API sont consommées depuis des frontends distincts configurés avec
    `USER_FRONTEND_ORIGINS` et `ADMIN_FRONTEND_ORIGINS`. En production, les deux variables sont obligatoires et ne
    peuvent pas contenir `*`. Les méthodes CORS sont GET, POST, PUT, PATCH, DELETE et OPTIONS; les headers autorisés
    sont Content-Type et Authorization. Les routes provider ne dépendent pas du CORS navigateur. CORS n'authentifie
    aucune requête.

    Légende des tags :
    - **MVola** / **Orange Money** : contrat reproduit depuis la documentation / les SDK publics (voir README pour les
      éléments marqués ASSUMPTION : non vérifiables publiquement).
    - **Mock** : endpoints MOCK-ONLY sous `/__mock`, absents des vrais fournisseurs.
servers:
  - url: http://localhost:4010
    description: Mock local (MVOLA_BASE_URL et ORANGE_MONEY_BASE_URL pointent ici)

tags:
  - name: MVola
    description: Merchant Pay v1 (sandbox réel https://devapi.mvola.mg, prod https://api.mvola.mg)
  - name: Orange Money
    description: WebPay (https://api.orange.com)
  - name: User
    description: Wallet utilisateur; le compte est toujours résolu depuis le token signé de l'utilisateur.
  - name: Mock
    description: |
      MOCK-ONLY – les seules routes sont la page de checkout Orange et sa confirmation, autorisées par le payToken.
  - name: Admin
    description: >-
      API en lecture seule, protégée par `Authorization: Bearer <MOCK_ADMIN_TOKEN>` et destinée au frontend admin séparé.

paths:
  /auth/register:
    post:
      tags: [User]
      operationId: registerUser
      summary: Créer un wallet utilisateur
      description: Le serveur génère un MSISDN unique selon les préfixes backend du provider. Le client ne peut pas choisir le MSISDN ni le solde.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
            example: { provider: MVOLA, password: secret123 }
      responses:
        "201":
          description: Compte créé; le hash du mot de passe n'est jamais retourné.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
              example: { provider: MVOLA, msisdn: "0341234567", balance: 0, currency: MGA, status: ACTIVE }
        "400":
          description: Provider ou mot de passe invalide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Impossible d'allouer un MSISDN unique
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/login:
    post:
      tags: [User]
      operationId: loginUser
      summary: Authentifier un utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { msisdn: "0341234567", password: secret123 }
      responses:
        "200":
          description: Jeton d'accès utilisateur signé, distinct de MOCK_ADMIN_TOKEN
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn]
                properties:
                  accessToken: { type: string }
                  tokenType: { type: string, enum: [Bearer] }
                  expiresIn: { type: integer, example: 3600 }
        "400":
          description: Requête invalide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: MSISDN ou mot de passe incorrect
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Compte bloqué
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /account:
    get:
      tags: [User]
      operationId: getCurrentAccount
      summary: Consulter son propre compte
      description: Le compte est dérivé du sujet du token; aucun MSISDN de compte n'est accepté comme sélecteur.
      security:
        - userBearer: []
      responses:
        "200":
          description: Compte authentifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "401":
          description: Token utilisateur absent, invalide ou expiré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Compte bloqué
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /account/balance:
    get:
      tags: [User]
      operationId: getCurrentBalance
      summary: Consulter son solde
      security:
        - userBearer: []
      responses:
        "200":
          description: Solde du compte authentifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BalanceResponse" }
        "401":
          description: Token utilisateur absent, invalide ou expiré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Compte bloqué
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /account/transactions:
    get:
      tags: [User]
      operationId: getCurrentAccountTransactions
      summary: Lister les transactions de son compte
      security:
        - userBearer: []
      responses:
        "200":
          description: Transactions du seul compte authentifié
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountTransactionListResponse" }
        "401":
          description: Token utilisateur absent, invalide ou expiré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Compte bloqué
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /account/topup:
    post:
      tags: [User]
      operationId: topUpCurrentAccount
      summary: Créditer son compte
      description: Les top-ups ne sont pas limités en nombre; chaque crédit atomique est refusé si le solde dépasserait MAX_BALANCE.
      security:
        - userBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TopUpRequest" }
            example: { amount: 500000 }
      responses:
        "200":
          description: Solde crédité et transaction TOPUP enregistrée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "400":
          description: Montant invalide ou inférieur ou égal à zéro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Token utilisateur absent, invalide ou expiré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Compte bloqué
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Le solde maximal serait dépassé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /account/reset:
    post:
      tags: [User]
      operationId: resetCurrentAccount
      summary: Remettre son propre solde à zéro
      security:
        - userBearer: []
      responses:
        "200":
          description: Solde remis à zéro; une transaction RESET est créée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "401":
          description: Token utilisateur absent, invalide ou expiré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: Compte bloqué
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/accounts:
    get:
      tags: [Admin]
      operationId: adminListAccounts
      summary: Lister les comptes
      security:
        - adminBearer: []
      responses:
        "200":
          description: Liste des comptes, sans hashes de mots de passe
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccountResponse" }
        "401":
          description: Token admin absent ou invalide

  /admin/accounts/{msisdn}:
    get:
      tags: [Admin]
      operationId: adminGetAccount
      summary: Consulter un compte
      security:
        - adminBearer: []
      parameters:
        - name: msisdn
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Compte
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountResponse" }
        "401":
          description: Token admin absent ou invalide
        "404":
          description: Compte inconnu

  /admin/accounts/{msisdn}/transactions:
    get:
      tags: [Admin]
      operationId: adminListAccountTransactions
      summary: Lister les transactions d'un compte
      security:
        - adminBearer: []
      parameters:
        - name: msisdn
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Transactions du compte
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TransactionResponse" }
        "401":
          description: Token admin absent ou invalide

  /health:
    get:
      tags: [Mock]
      operationId: health
      summary: Vérifier que le service répond
      responses:
        "200":
          description: Service disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
              example: { status: ok }

  # ------------------------------------------------------------------ MVola
  /token:
    post:
      tags: [MVola]
      operationId: mvolaToken
      summary: Obtenir un access token MVola
      description: En développement, toute paire key:secret non vide est acceptée; en production, credentials vérifiés par MVOLA_CLIENT_KEY et MVOLA_CLIENT_SECRET.
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                scope:
                  type: string
                  example: EXT_INT_MVOLA_SCOPE
            example:
              grant_type: client_credentials
              scope: EXT_INT_MVOLA_SCOPE
      responses:
        "200":
          description: Token généré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MvolaToken" }
              example:
                access_token: e25c5488c36b0c18a38893215d0d2f9a9aec4fdf2cbec7e4
                scope: EXT_INT_MVOLA_SCOPE
                token_type: Bearer
                expires_in: 3600
        "400":
          description: grant_type invalide
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
              example:
                error: unsupported_grant_type
                error_description: grant_type must be client_credentials
        "401":
          description: Credentials Basic manquants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
              example:
                error: invalid_client
                error_description: "Client authentication failed (send Authorization: Basic base64(key:secret))"

  /mvola/mm/transactions/type/merchantpay/{version}/:
    post:
      tags: [MVola]
      operationId: mvolaInitiate
      summary: Initier un paiement (Merchant Pay)
      description: |
        Retourne `pending`. Après 1 seconde par défaut, un compte connu avec un solde suffisant réussit à 90%; sinon
        le statut final est `failed`. Le résultat s'obtient par polling (status) ou par callback si `X-Callback-URL`
        est envoyé (le mock fait alors un `PUT` vers cette URL).

        Le wallet débité est le compte PostgreSQL dont le MSISDN figure dans `debitParty`. Le compte doit exister,
        être de provider `MVOLA`, être actif et disposer d'un solde suffisant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Version"
        - $ref: "#/components/parameters/HVersion"
        - $ref: "#/components/parameters/XCorrelationID"
        - $ref: "#/components/parameters/UserLanguage"
        - $ref: "#/components/parameters/UserAccountIdentifier"
        - $ref: "#/components/parameters/PartnerName"
        - $ref: "#/components/parameters/CacheControl"
        - name: X-Callback-URL
          in: header
          required: false
          description: |
            Si présent, notificationMethod = callback. En production, HTTPS et hostname dans CALLBACK_ALLOWED_HOSTS;
            les redirections sont refusées et le callback expire après 5 secondes.
          schema: { type: string, format: uri }
          example: http://localhost:3000/mvola/callback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MvolaInitiateRequest" }
            examples:
              paiement500:
                summary: 500 Ar depuis un compte MVola existant
                value:
                  amount: "500"
                  currency: Ar
                  descriptionText: NovaMarket order 42
                  requestingOrganisationTransactionReference: order-42-a1
                  originalTransactionReference: order-42-a1
                  requestDate: "2026-09-29T10:00:00.000Z"
                  debitParty:
                    - { key: msisdn, value: "0341234567" }
                  creditParty:
                    - { key: msisdn, value: "0343500001" }
                  metadata:
                    - { key: partnerName, value: NovaMarket }
                    - { key: fc, value: USD }
                    - { key: amountFc, value: "1" }
              soldeInsuffisant:
                summary: Un MSISDN inconnu ou sans solde suffisant finit en failed
                value:
                  amount: "5000"
                  currency: Ar
                  descriptionText: Test solde insuffisant
                  requestingOrganisationTransactionReference: order-43-a1
                  requestDate: "2026-09-29T10:00:00.000Z"
                  debitParty:
                    - { key: msisdn, value: "0347654321" }
                  creditParty:
                    - { key: msisdn, value: "0343500001" }
      responses:
        "202":
          description: Paiement accepté (HTTP 202 = ASSUMPTION, tout 2xx est valide côté client)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MvolaInitiateResponse" }
              examples:
                polling:
                  value:
                    status: pending
                    serverCorrelationId: 6747819c-bcae-4c0c-ba82-1b6c854ade1d
                    notificationMethod: polling
                callback:
                  value:
                    status: pending
                    serverCorrelationId: 6747819c-bcae-4c0c-ba82-1b6c854ade1d
                    notificationMethod: callback
        "400":
          $ref: "#/components/responses/MvolaValidationError"
        "401":
          $ref: "#/components/responses/MvolaInvalidCredentials"
        "409":
          description: requestingOrganisationTransactionReference déjà utilisé (ASSUMPTION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MvolaError" }
              example:
                errorCategory: businessRule
                errorCode: duplicateRequest
                errorDescription: requestingOrganisationTransactionReference already used
                errorDateTime: "2026-09-29T11:48:48.982Z"
                errorParameters:
                  - { key: requestingOrganisationTransactionReference, value: order-42-a1 }
        "503":
          description: Scénario mock `provider_error`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MvolaError" }
              example:
                errorCategory: internal
                errorCode: genericError
                errorDescription: "The service is not currently available (mock scenario: provider_error)"
                errorDateTime: "2026-09-29T11:48:50.167Z"
                errorParameters: []
        "504":
          description: Scénario mock `timeout`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MvolaError" }
              example:
                errorCategory: internal
                errorCode: genericError
                errorDescription: "Gateway timeout (mock scenario: timeout)"
                errorDateTime: "2026-09-29T11:50:00.000Z"
                errorParameters: []
      callbacks:
        mvolaCallback:
          "{$request.header.X-Callback-URL}":
            put:
              summary: Callback envoyé par le mock à la fin du paiement
              requestBody:
                content:
                  application/json:
                    schema: { $ref: "#/components/schemas/MvolaCallback" }
                    examples:
                      completed:
                        value:
                          transactionStatus: completed
                          serverCorrelationId: 6747819c-bcae-4c0c-ba82-1b6c854ade1d
                          transactionReference: "899944982"
                          requestDate: "2026-09-29T10:00:00.000Z"
                          debitParty: [{ key: msisdn, value: "03435000005" }]
                          creditParty: [{ key: msisdn, value: "0343500001" }]
                          fees: [{ feeAmount: "0" }]
                          metadata: [{ key: partnerName, value: NovaMarket }]
                      failed:
                        value:
                          transactionStatus: failed
                          serverCorrelationId: 10216284-c287-47ee-85df-231e252d8ec9
                          transactionReference: "559590389"
                          requestDate: "2026-09-29T10:00:00.000Z"
                          debitParty: [{ key: msisdn, value: "03435000001" }]
                          creditParty: [{ key: msisdn, value: "0343500001" }]
                          metadata: []
              responses:
                "200":
                  description: Réponse ignorée par le mock

  /mvola/mm/transactions/type/merchantpay/{version}/status/{serverCorrelationId}:
    get:
      tags: [MVola]
      operationId: mvolaStatus
      summary: Statut d'une transaction (polling)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Version"
        - name: serverCorrelationId
          in: path
          required: true
          schema: { type: string, format: uuid }
          example: 6747819c-bcae-4c0c-ba82-1b6c854ade1d
        - $ref: "#/components/parameters/HVersion"
        - $ref: "#/components/parameters/XCorrelationID"
        - $ref: "#/components/parameters/UserLanguage"
        - $ref: "#/components/parameters/UserAccountIdentifier"
        - $ref: "#/components/parameters/PartnerName"
        - $ref: "#/components/parameters/CacheControl"
      responses:
        "200":
          description: Statut courant. `objectReference` est vide tant que la transaction n'est pas réglée.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MvolaStatusResponse" }
              examples:
                pending:
                  value:
                    status: pending
                    serverCorrelationId: 6747819c-bcae-4c0c-ba82-1b6c854ade1d
                    notificationMethod: polling
                    objectReference: ""
                completed:
                  value:
                    status: completed
                    serverCorrelationId: 6747819c-bcae-4c0c-ba82-1b6c854ade1d
                    notificationMethod: polling
                    objectReference: "899944982"
                failed:
                  value:
                    status: failed
                    serverCorrelationId: 10216284-c287-47ee-85df-231e252d8ec9
                    notificationMethod: polling
                    objectReference: "559590389"
        "400":
          $ref: "#/components/responses/MvolaValidationError"
        "401":
          $ref: "#/components/responses/MvolaInvalidCredentials"
        "404":
          $ref: "#/components/responses/MvolaNotFound"

  /mvola/mm/transactions/type/merchantpay/{version}/{transId}:
    get:
      tags: [MVola]
      operationId: mvolaDetails
      summary: Détails d'une transaction
      description: "`transId` = `objectReference` retourné par l'appel status."
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Version"
        - name: transId
          in: path
          required: true
          schema: { type: string }
          example: "899944982"
        - $ref: "#/components/parameters/HVersion"
        - $ref: "#/components/parameters/XCorrelationID"
        - $ref: "#/components/parameters/UserLanguage"
        - $ref: "#/components/parameters/UserAccountIdentifier"
        - $ref: "#/components/parameters/PartnerName"
        - $ref: "#/components/parameters/CacheControl"
      responses:
        "200":
          description: Détails
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MvolaDetails" }
              examples:
                completed:
                  value:
                    amount: "500"
                    currency: Ar
                    transactionReference: "899944982"
                    transactionStatus: completed
                    createDate: "2026-09-29T11:48:46.800Z"
                    debitParty: [{ key: msisdn, value: "03435000005" }]
                    creditParty: [{ key: msisdn, value: "0343500001" }]
                    metadata:
                      - { key: originalTransactionResult, value: "0" }
                      - { key: originalTransactionResultDesc, value: Completed }
                    fees: [{ feeAmount: "0" }]
                failed:
                  value:
                    amount: "5000"
                    currency: Ar
                    transactionReference: "559590389"
                    transactionStatus: failed
                    createDate: "2026-09-29T11:48:48.100Z"
                    debitParty: [{ key: msisdn, value: "03435000001" }]
                    creditParty: [{ key: msisdn, value: "0343500001" }]
                    metadata:
                      - { key: originalTransactionResult, value: "1001" }
                      - { key: originalTransactionResultDesc, value: Insufficient funds }
                    fees: [{ feeAmount: "0" }]
        "400":
          $ref: "#/components/responses/MvolaValidationError"
        "401":
          $ref: "#/components/responses/MvolaInvalidCredentials"
        "404":
          $ref: "#/components/responses/MvolaNotFound"

  # ----------------------------------------------------------- Orange Money
  /oauth/v3/token:
    post:
      tags: [Orange Money]
      operationId: orangeToken
      summary: Obtenir un access token Orange
      description: En développement, toute valeur `Basic` non vide est acceptée; en production, valeur comparée à ORANGE_BASIC_AUTH.
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
            example:
              grant_type: client_credentials
      responses:
        "200":
          description: Token généré
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrangeToken" }
              example:
                token_type: Bearer
                access_token: f4d30a0c9362c36dab417c2b2f894c935928e079a48251d4
                expires_in: "7776000"
        "401":
          description: Authorization Basic manquant (ASSUMPTION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthError" }
              example:
                error: invalid_client
                error_description: The requested client is not authorized (mock convention)

  /orange-money-webpay/{country}/v1/webpayment:
    post:
      tags: [Orange Money]
      operationId: orangeWebPayment
      summary: Initier un paiement WebPay
      description: |
        Retourne un `pay_token` et une `payment_url`. Ici `payment_url` pointe vers la page mock
        `/__mock/orange/pay/{pay_token}`. Le client (simulé) y choisit un compte Orange Money existant. Après confirmation,
        le mock attend 1 seconde par défaut, puis règle le paiement : compte actif et solde suffisant donnent
        90% de chances de `SUCCESS`; les autres résultats sont `FAILED`. Une notification est envoyée à `notif_url`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Country"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrangeWebPaymentRequest" }
            example:
              merchant_key: myMerchantKey
              currency: MGA
              order_id: ORD-42
              amount: 2500
              return_url: http://localhost:3000/return
              cancel_url: http://localhost:3000/cancel
              notif_url: http://localhost:3000/notif
              lang: fr
              reference: NovaMarket order 42
      responses:
        "201":
          description: Paiement initié (statut INITIATED)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrangeWebPaymentResponse" }
              example:
                status: 201
                message: OK
                pay_token: 34370449153816847b025111f7d88d5af349552043051577486d1962d6eceaf3
                payment_url: http://localhost:4010/__mock/orange/pay/34370449153816847b025111f7d88d5af349552043051577486d1962d6eceaf3
                notif_token: e37cec8bde0d09c55f54122423024f22
        "400":
          description: Champ obligatoire manquant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrangeError" }
              example:
                code: 23
                message: Missing body field
                description: "Key: 'WebPaymentInfo.merchant_key' Error:Field validation for 'merchant_key' failed on the 'required' tag"
        "401":
          $ref: "#/components/responses/OrangeInvalidToken"
        "500":
          description: Scénario mock `provider_error`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrangeError" }
              example:
                code: 500
                message: Internal Server Error
                description: "Mock scenario: provider_error"
        "504":
          description: Scénario mock `timeout`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrangeError" }
              example:
                code: 504
                message: Gateway Timeout
                description: "Mock scenario: timeout"
      callbacks:
        orangeNotification:
          "{$request.body#/notif_url}":
            post:
              summary: Notification envoyée par le mock à la fin du paiement
              requestBody:
                content:
                  application/json:
                    schema: { $ref: "#/components/schemas/OrangeNotification" }
                    examples:
                      success:
                        value:
                          status: SUCCESS
                          notif_token: e37cec8bde0d09c55f54122423024f22
                          txnid: MP260929.1148.D333D
                      failed:
                        value:
                          status: FAILED
                          notif_token: e37cec8bde0d09c55f54122423024f22
              responses:
                "200":
                  description: Réponse ignorée par le mock

  /orange-money-webpay/{country}/v1/transactionstatus:
    post:
      tags: [Orange Money]
      operationId: orangeTransactionStatus
      summary: Statut d'une transaction WebPay
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Country"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrangeStatusRequest" }
            example:
              order_id: ORD-42
              amount: 2500
              pay_token: 34370449153816847b025111f7d88d5af349552043051577486d1962d6eceaf3
      responses:
        "200":
          description: Statut. `txnid` seulement en cas de SUCCESS. Un INITIATED non confirmé passe à EXPIRED après 10 min.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrangeStatusResponse" }
              examples:
                initiated:
                  value: { status: INITIATED, order_id: ORD-42 }
                pending:
                  value: { status: PENDING, order_id: ORD-42 }
                success:
                  value: { status: SUCCESS, order_id: ORD-42, txnid: MP260929.1148.D333D }
                failed:
                  value: { status: FAILED, order_id: ORD-42 }
                expired:
                  value: { status: EXPIRED, order_id: ORD-42 }
        "400":
          description: Champ manquant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrangeError" }
              example:
                code: 23
                message: Missing body field
                description: "Key: 'GetTransactionStatusInfo.OrderId' Error:Field validation for 'OrderId' failed on the 'required' tag"
        "401":
          $ref: "#/components/responses/OrangeInvalidToken"
        "404":
          description: order_id / amount / pay_token inconnus ou incohérents (ASSUMPTION)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrangeError" }
              example:
                code: 60
                message: Transaction not found
                description: No transaction matches order_id, amount and pay_token (mock convention)

  # ------------------------------------------------------------------- Mock
  
  /__mock/orange/pay/{payToken}:
    get:
      tags: [Mock]
      operationId: mockOrangeHostedPage
      summary: Page de paiement Orange simulée (HTML)
      description: Remplace la page hébergée réelle d'Orange. Affiche les comptes Orange Money existants et actifs.
      parameters:
        - $ref: "#/components/parameters/PayToken"
      responses:
        "200":
          description: Page HTML
          content:
            text/html:
              schema: { type: string }
        "404":
          $ref: "#/components/responses/MockNotFound"

  /__mock/orange/pay/{payToken}/confirm:
    post:
      tags: [Mock]
      operationId: mockOrangeConfirm
      summary: Simuler le client qui confirme avec un compte Orange Money
      description: |
        Passe la transaction de INITIATED à PENDING puis la règle après `settleDelayMs`.
        Depuis le formulaire HTML (form-urlencoded) : redirection 303 vers `return_url`.
      parameters:
        - $ref: "#/components/parameters/PayToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [msisdn]
              properties:
                msisdn:
                  type: string
                  pattern: "^\\d{10}$"
            example:
              msisdn: "0321234567"
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [msisdn]
              properties:
                msisdn: { type: string, pattern: "^\\d{10}$" }
      responses:
        "200":
          description: Transaction passée à PENDING
          content:
            application/json:
              schema:
                type: object
                required: [status, order_id, msisdn]
                properties:
                  status: { $ref: "#/components/schemas/OrangeStatus" }
                  order_id: { type: string }
                  msisdn: { type: string }
              example: { status: PENDING, order_id: ORD-42, msisdn: "0321234567" }
        "303":
          description: Redirection vers return_url (soumission du formulaire HTML)
        "400":
          description: MSISDN inconnu ou qui ne correspond pas à un compte Orange Money
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockError" }
              example: { error: MOCK_ERROR, message: "0321234567 is not an existing ORANGE_MONEY account" }
        "404":
          $ref: "#/components/responses/MockNotFound"
        "409":
          description: Transaction déjà confirmée / expirée
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MockError" }
              example: { error: MOCK_ERROR, message: "Transaction is SUCCESS, cannot confirm" }

# ====================================================================
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton utilisateur signé avec USER_AUTH_SECRET, distinct de MOCK_ADMIN_TOKEN.
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Valeur de `MOCK_ADMIN_TOKEN`.
    basicAuth:
      type: http
      scheme: basic
      description: consumerKey:consumerSecret (MVola) ou header d'autorisation de l'app Orange. Le mock accepte toute valeur non vide.
    bearerAuth:
      type: http
      scheme: bearer
      description: Token obtenu via /token (MVola) ou /oauth/v3/token (Orange). Chaque fournisseur a ses propres tokens.

  parameters:
    Version:
      name: version
      in: path
      required: true
      schema: { type: string, enum: ["1.0.0", "1.0"], default: "1.0.0" }
    HVersion:
      name: Version
      in: header
      required: true
      schema: { type: string, enum: ["1", "1.0", "1.0.0"] }
      example: "1.0"
    XCorrelationID:
      name: X-CorrelationID
      in: header
      required: true
      description: UUID unique par requête, 40 caractères max.
      schema: { type: string, format: uuid }
      example: 123e4567-e89b-12d3-a456-426614174000
    UserLanguage:
      name: UserLanguage
      in: header
      required: true
      schema: { type: string, enum: [FR, MG] }
      example: FR
    UserAccountIdentifier:
      name: UserAccountIdentifier
      in: header
      required: true
      description: "Format `msisdn;<numéro marchand>`"
      schema: { type: string, pattern: "^msisdn;\\S+$" }
      example: "msisdn;0343500001"
    PartnerName:
      name: partnerName
      in: header
      required: true
      schema: { type: string, maxLength: 50 }
      example: NovaMarket
    CacheControl:
      name: Cache-Control
      in: header
      required: false
      schema: { type: string }
      example: no-cache
    Country:
      name: country
      in: path
      required: true
      description: "`dev` = sandbox (documenté). `mg` = production Madagascar (ASSUMPTION)."
      schema: { type: string, enum: [dev, mg] }
      example: mg
    PayToken:
      name: payToken
      in: path
      required: true
      schema: { type: string }
      example: 34370449153816847b025111f7d88d5af349552043051577486d1962d6eceaf3

  responses:
    MvolaInvalidCredentials:
      description: Token absent, invalide ou expiré (format OFFICIEL de la doc MVola)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MvolaFault" }
          example:
            fault:
              code: 900901
              message: Invalid Credentials
              description: Invalid Credentials. Make sure you have given the correct access token
    MvolaValidationError:
      description: En-tête ou champ invalide/manquant (casse camelCase = ASSUMPTION)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MvolaError" }
          examples:
            enteteManquant:
              value:
                errorCategory: validation
                errorCode: formatError
                errorDescription: "Missing required header: Version"
                errorDateTime: "2026-09-29T11:48:48.999Z"
                errorParameters: [{ key: Version, value: required }]
            champInvalide:
              value:
                errorCategory: validation
                errorCode: formatError
                errorDescription: "Invalid JSON Field: amount must be a positive numeric string"
                errorDateTime: "2026-09-29T11:49:10.120Z"
                errorParameters: [{ key: amount, value: must be a positive numeric string }]
    MvolaNotFound:
      description: Identifiant inconnu
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MvolaError" }
          example:
            errorCategory: validation
            errorCode: notFound
            errorDescription: Unknown serverCorrelationId
            errorDateTime: "2026-09-29T11:51:00.000Z"
            errorParameters: [{ key: serverCorrelationId, value: 00000000-0000-0000-0000-000000000000 }]
    OrangeInvalidToken:
      description: Token invalide ou expiré (code 41 = ASSUMPTION)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OrangeError" }
          example:
            code: 41
            message: Invalid token
            description: Invalid or expired access token (mock convention)
    MockNotFound:
      description: Compte ou pay_token inconnu
      content:
        application/json:
          schema: { $ref: "#/components/schemas/MockError" }
          example: { error: MOCK_ERROR, message: Unknown account }

  schemas:
    RegisterRequest:
      type: object
      required: [provider, password]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [MVOLA, ORANGE_MONEY] }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
    LoginRequest:
      type: object
      required: [msisdn, password]
      additionalProperties: false
      properties:
        msisdn: { type: string, pattern: "^\\d{10}$" }
        password: { type: string, minLength: 8, maxLength: 128, format: password }
    AccountResponse:
      type: object
      required: [provider, msisdn, balance, currency, status]
      properties:
        provider: { type: string, enum: [MVOLA, ORANGE_MONEY] }
        msisdn: { type: string, pattern: "^\\d{10}$" }
        balance: { type: number, minimum: 0 }
        currency: { type: string, example: MGA }
        status: { type: string, enum: [ACTIVE, BLOCKED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BalanceResponse:
      type: object
      required: [balance, currency]
      properties:
        balance: { type: number, minimum: 0 }
        currency: { type: string, example: MGA }
    TopUpRequest:
      type: object
      required: [amount]
      additionalProperties: false
      properties:
        amount: { type: number, minimum: 0, exclusiveMinimum: true }
    TransactionResponse:
      type: object
      required: [id, accountId, provider, type, amount, currency, status, reference, balanceBefore, balanceAfter, createdAt]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        provider: { type: string, enum: [MVOLA, ORANGE_MONEY] }
        type: { type: string, enum: [PAYMENT, TOPUP, RESET, REFUND] }
        amount: { type: number, minimum: 0 }
        currency: { type: string }
        status: { type: string, enum: [SUCCESS, FAILED] }
        reference: { type: string }
        balanceBefore: { type: number, minimum: 0 }
        balanceAfter: { type: number, minimum: 0 }
        createdAt: { type: string, format: date-time }
    AccountTransactionListResponse:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          items: { $ref: "#/components/schemas/TransactionResponse" }
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string }
    # ---- MVola
    KeyValue:
      type: object
      required: [key, value]
      properties:
        key: { type: string }
        value: { type: string }
    MvolaToken:
      type: object
      properties:
        access_token: { type: string }
        scope: { type: string }
        token_type: { type: string, enum: [Bearer] }
        expires_in: { type: integer, example: 3600 }
    MvolaInitiateRequest:
      type: object
      required: [amount, currency, descriptionText, requestingOrganisationTransactionReference, requestDate, debitParty, creditParty]
      properties:
        amount: { type: string, pattern: "^\\d+(\\.\\d+)?$", description: Chaîne numérique > 0 }
        currency: { type: string, enum: [Ar] }
        descriptionText: { type: string }
        requestingOrganisationTransactionReference: { type: string, maxLength: 50, description: "Unique (doublon = 409, ASSUMPTION)" }
        originalTransactionReference: { type: string, maxLength: 50 }
        requestDate: { type: string, format: date-time }
        debitParty:
          type: array
          description: Client. Pour le mock, msisdn doit correspondre à un wallet MVola persistant existant.
          items: { $ref: "#/components/schemas/KeyValue" }
        creditParty:
          type: array
          description: Marchand
          items: { $ref: "#/components/schemas/KeyValue" }
        metadata:
          type: array
          description: partnerName, fc (devise étrangère), amountFc
          items: { $ref: "#/components/schemas/KeyValue" }
    MvolaStatus:
      type: string
      enum: [pending, completed, failed]
    MvolaInitiateResponse:
      type: object
      properties:
        status: { type: string, enum: [pending] }
        serverCorrelationId: { type: string, format: uuid }
        notificationMethod: { type: string, enum: [callback, polling] }
    MvolaStatusResponse:
      type: object
      properties:
        status: { $ref: "#/components/schemas/MvolaStatus" }
        serverCorrelationId: { type: string, format: uuid }
        notificationMethod: { type: string, enum: [callback, polling] }
        objectReference: { type: string, description: Vide tant que la transaction n'est pas réglée }
    MvolaDetails:
      type: object
      properties:
        amount: { type: string }
        currency: { type: string, enum: [Ar] }
        transactionReference: { type: string }
        transactionStatus: { $ref: "#/components/schemas/MvolaStatus" }
        createDate: { type: string, format: date-time }
        debitParty: { type: array, items: { $ref: "#/components/schemas/KeyValue" } }
        creditParty: { type: array, items: { $ref: "#/components/schemas/KeyValue" } }
        metadata:
          type: array
          description: originalTransactionResult, originalTransactionResultDesc (codes = ASSUMPTION)
          items: { $ref: "#/components/schemas/KeyValue" }
        fees:
          type: array
          items:
            type: object
            properties:
              feeAmount: { type: string }
    MvolaCallback:
      type: object
      properties:
        transactionStatus: { $ref: "#/components/schemas/MvolaStatus" }
        serverCorrelationId: { type: string, format: uuid }
        transactionReference: { type: string }
        requestDate: { type: string }
        debitParty: { type: array, items: { $ref: "#/components/schemas/KeyValue" } }
        creditParty: { type: array, items: { $ref: "#/components/schemas/KeyValue" } }
        fees:
          type: array
          description: Présent seulement si completed
          items:
            type: object
            properties:
              feeAmount: { type: string }
        metadata: { type: array, items: { $ref: "#/components/schemas/KeyValue" } }
    MvolaError:
      type: object
      description: Format GSMA en camelCase (ASSUMPTION ; la doc MVola liste ErrorCategory… en majuscule initiale)
      properties:
        errorCategory: { type: string }
        errorCode: { type: string }
        errorDescription: { type: string }
        errorDateTime: { type: string, format: date-time }
        errorParameters: { type: array, items: { $ref: "#/components/schemas/KeyValue" } }
    MvolaFault:
      type: object
      properties:
        fault:
          type: object
          properties:
            code: { type: integer, example: 900901 }
            message: { type: string }
            description: { type: string }
    OAuthError:
      type: object
      properties:
        error: { type: string }
        error_description: { type: string }

    # ---- Orange Money
    OrangeToken:
      type: object
      properties:
        token_type: { type: string, enum: [Bearer] }
        access_token: { type: string }
        expires_in: { type: string, description: "Chaîne, comme dans les SDK Orange" }
    OrangeStatus:
      type: string
      enum: [INITIATED, PENDING, EXPIRED, SUCCESS, FAILED]
      description: |
        INITIATED : en attente du client. PENDING : client a confirmé. SUCCESS / FAILED : final.
        EXPIRED : confirmation trop tardive (pay_token valide 10 min).
    OrangeWebPaymentRequest:
      type: object
      required: [merchant_key, currency, order_id, amount, return_url, cancel_url, notif_url]
      properties:
        merchant_key: { type: string }
        currency: { type: string, description: "OUV en sandbox ; valeur prod Madagascar non confirmée (MGA probable). Non validée par le mock." }
        order_id: { type: string }
        amount: { type: number, minimum: 1 }
        return_url: { type: string, format: uri }
        cancel_url: { type: string, format: uri }
        notif_url: { type: string, format: uri, description: "Callback HTTP(S); en production, HTTPS vers un hostname CALLBACK_ALLOWED_HOSTS" }
        lang: { type: string, example: fr }
        reference: { type: string }
    OrangeWebPaymentResponse:
      type: object
      properties:
        status: { type: integer, example: 201 }
        message: { type: string, example: OK }
        pay_token: { type: string }
        payment_url: { type: string, format: uri, description: "MOCK : /__mock/orange/pay/{pay_token}" }
        notif_token: { type: string }
    OrangeStatusRequest:
      type: object
      required: [order_id, amount, pay_token]
      properties:
        order_id: { type: string }
        amount: { type: number }
        pay_token: { type: string }
    OrangeStatusResponse:
      type: object
      properties:
        status: { $ref: "#/components/schemas/OrangeStatus" }
        order_id: { type: string }
        txnid: { type: string, description: Seulement si SUCCESS }
    OrangeNotification:
      type: object
      properties:
        status: { $ref: "#/components/schemas/OrangeStatus" }
        notif_token: { type: string }
        txnid: { type: string }
    OrangeError:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        description: { type: string }

    # ---- Mock checkout errors
    MockError:
      type: object
      properties:
        error: { type: string, example: MOCK_ERROR }
        message: { type: string }
